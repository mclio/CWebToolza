<head>
  <title>CWebtoolza : Backwards</title>
</head>
<body>
  <a href="../index.html">Back</a>
  <br><hr><br>
  <input type="text" name="text" id="input"/>
  <button id="btn" onclick="backwards()">Backwards</button>

  <script>
    function backwards()
    {
      alert(document.getElementById('input').innerHTML.split("").reverse().join(""));
    }
  </script>
</body>
